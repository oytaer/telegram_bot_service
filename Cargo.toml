[package]
name = "telegram_bot_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
actix-cors = "0.7.1"
tokio = {version = "1.52.3",features = ["rt-multi-thread","macros","time","sync","signal"]}

reqwest = {version = "0.13.4", default-features = false,features = ["json","rustls","multipart"]}

serde = {version = "1.0.228",features = ["derive"]}
serde_json = "1.0.150"

thiserror = "2.0.18"
anyhow = "1.0.102"

async-trait = "0.1.89"

tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23",features = ["env-filter"]}

dotenvy = "0.15.7"

chrono = {version = "0.4.45",features = ["serde"]}